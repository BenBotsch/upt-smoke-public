name: "Bug Report"
description: "Report an unexpected behavior or defect."
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:triage"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Do not disclose credentials or sensitive data.
        Report security vulnerabilities privately as described in SECURITY.md, not in this form.
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "Describe the problem clearly."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, application version, runtime, dependencies."
    validations:
      required: true
  # Severity describes the impact. It is stored as text in the issue body and does not set a
  # priority label; the priority is a separate triage decision.
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Logs and Evidence"
      description: "Attach sanitized logs, screenshots or traces. Write 'None' if nothing is available."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      value: |
        - [ ] Root cause is identified.
        - [ ] A regression test is added or the omission is justified.
        - [ ] The fix passes applicable CI checks.
    validations:
      required: true
