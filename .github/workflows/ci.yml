# Universal base CI: validates repository structure and project configuration.
# Stack-specific jobs (format, lint, test, build) are added by technology profiles.
name: "CI"

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  repository-validation:
    name: "repository-validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: "Install validator dependencies"
        run: python -I -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: "Test validator scripts"
        run: python -I -m pytest tests/ci
      - name: "Validate project configuration"
        run: python -I scripts/ci/validate_project.py
      - name: "Validate repository structure"
        run: python -I scripts/ci/validate_repository.py
