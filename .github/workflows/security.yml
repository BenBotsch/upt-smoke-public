# Security baseline: secret scanning and action pinning.
# CodeQL, dependency and container scanning are added per technology profile.
# Reusable workflow: ci.yml calls it for pull requests and pushes, so the quality-gate job can
# evaluate its jobs. The weekly schedule runs it on its own.
name: "Security"

on:
  workflow_call:
  schedule:
    # Weekly full-history scan, Mondays at 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "security-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  secret-scan:
    name: "secret-scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: "Check out repository with full history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install Gitleaks"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
      - name: "Scan the commits of the pull request"
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner
          --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: "Scan the full history"
        if: github.event_name != 'pull_request'
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner .

  actions-pinning:
    name: "actions-pinning"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Check that actions are pinned to commit SHAs"
        run: python3 -I scripts/ci/check_action_pinning.py
