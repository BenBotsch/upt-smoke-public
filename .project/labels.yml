# Declarative label taxonomy: the single source for label synchronization.
# Naming, color logic and extension rules: docs/governance/issue-management.md
# Check locally: python -I scripts/ci/check_labels.py .project/labels.yml
schema_version: "1.0"
labels:
  # type: exactly one per issue; colors from the specification example
  - name: "type:bug"
    color: "d73a4a"
    description: "Unexpected behavior or defect"
    group: "type"
  - name: "type:task"
    color: "1d76db"
    description: "Actionable engineering task"
    group: "type"
  - name: "type:feature"
    color: "a2eeef"
    description: "New capability or functionality"
    group: "type"
  - name: "type:epic"
    color: "5319e7"
    description: "Multi-issue initiative"
    group: "type"
  - name: "type:improvement"
    color: "fbca04"
    description: "Enhancement of existing behavior"
    group: "type"
  - name: "type:documentation"
    color: "0075ca"
    description: "Documentation work"
    group: "type"

  # priority: red (urgent) to green (low)
  - name: "priority:critical"
    color: "b60205"
    description: "Urgent and business-critical"
    group: "priority"
  - name: "priority:high"
    color: "d93f0b"
    description: "High priority"
    group: "priority"
  - name: "priority:medium"
    color: "fbca04"
    description: "Normal priority"
    group: "priority"
  - name: "priority:low"
    color: "c2e0c6"
    description: "Low priority"
    group: "priority"

  # status: exactly one per open issue; closed is the native issue state
  - name: "status:triage"
    color: "ededed"
    description: "Awaiting classification"
    group: "status"
  - name: "status:ready"
    color: "0e8a16"
    description: "Ready for implementation"
    group: "status"
  - name: "status:in-progress"
    color: "1d76db"
    description: "Being worked on"
    group: "status"
  - name: "status:blocked"
    color: "b60205"
    description: "Blocked by dependency or decision"
    group: "status"
  - name: "status:review"
    color: "7057ff"
    description: "Awaiting review"
    group: "status"
  - name: "status:needs-info"
    color: "fef2c0"
    description: "Additional details required"
    group: "status"

  # area: one shared light blue
  - name: "area:backend"
    color: "c5def5"
    description: "Server-side logic, services and data processing"
    group: "area"
  - name: "area:frontend"
    color: "c5def5"
    description: "User interface and client-side code"
    group: "area"
  - name: "area:api"
    color: "c5def5"
    description: "Public or internal interfaces and contracts"
    group: "area"
  - name: "area:ci-cd"
    color: "c5def5"
    description: "Build, test and deployment pipelines"
    group: "area"
  - name: "area:docs"
    color: "c5def5"
    description: "Documentation sources and structure"
    group: "area"
  - name: "area:security"
    color: "c5def5"
    description: "Security controls, policies and tooling"
    group: "area"

  # effort: light to dark violet as size grows
  - name: "effort:xs"
    color: "ede4fb"
    description: "Very small, under one hour"
    group: "effort"
  - name: "effort:s"
    color: "d4c2f4"
    description: "Small, up to half a day"
    group: "effort"
  - name: "effort:m"
    color: "b69be9"
    description: "Medium, one to two days"
    group: "effort"
  - name: "effort:l"
    color: "9370db"
    description: "Large, several days; consider splitting"
    group: "effort"
  - name: "effort:xl"
    color: "6f42c1"
    description: "Very large, must be split before implementation"
    group: "effort"

  # impact: orange family, cross-cutting consequences
  - name: "impact:breaking"
    color: "e4590e"
    description: "Breaks compatibility; requires a major version or migration"
    group: "impact"
  - name: "impact:performance"
    color: "f9a65a"
    description: "Affects speed, memory or resource usage"
    group: "impact"
  - name: "impact:security"
    color: "f6c79a"
    description: "Affects confidentiality, integrity or availability"
    group: "impact"

  # agent: teal family, agent suitability and approval state
  - name: "agent:ready"
    color: "b2f0e3"
    description: "Fully specified and approved for a coding agent"
    group: "agent"
  - name: "agent:working"
    color: "3fbfa6"
    description: "A coding agent is working on this"
    group: "agent"
  - name: "agent:review-required"
    color: "0f766e"
    description: "Agent output awaits human review"
    group: "agent"

  # meta: labels without a group prefix
  - name: "skip-changelog"
    color: "d4d4d4"
    description: "Exclude this pull request from release notes"
    group: "meta"
