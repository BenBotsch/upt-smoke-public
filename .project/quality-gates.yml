# Quality gates and the CI jobs that implement them.
# A final aggregator job compares this file with the actual job results. A required gate
# passes only with result "success"; "skipped", missing or not implemented fail it.
#
# Per gate:
#   required | required_when_applicable | required_for_code_changes |
#   review_required_for_relevant_changes   when the gate applies
#   workflow   workflow file in .github/workflows/ that contains the job
#   job        CI job id that implements the gate
#   status     "implemented" or "not_implemented"
schema_version: "1.0"
quality_gates:
  repository_validation:
    required: true
    workflow: "ci.yml"
    job: "repository-validation"
    status: "implemented"
  issue_validation:
    required: true
    workflow: "issue-validation.yml"
    job: "issue-validation"
    status: "not_implemented"
  pull_request_validation:
    required: true
    workflow: "pr-validation.yml"
    job: "pr-validation"
    status: "implemented"
  conventional_commits:
    required: true
    workflow: "pr-validation.yml"
    job: "commitlint"
    status: "implemented"
  workflow_lint:
    required: true
    workflow: "quality.yml"
    job: "workflow-lint"
    status: "implemented"
  secret_scan:
    required: true
    workflow: "security.yml"
    job: "secret-scan"
    status: "implemented"
  formatting:
    required_when_applicable: true
    workflow: "ci.yml"
    job: "format"
    status: "not_implemented"
  lint:
    required_when_applicable: true
    workflow: "ci.yml"
    job: "lint"
    status: "not_implemented"
  tests:
    required_for_code_changes: true
    workflow: "ci.yml"
    job: "test"
    status: "not_implemented"
  build:
    required_when_applicable: true
    workflow: "ci.yml"
    job: "build"
    status: "not_implemented"
  security:
    required_when_applicable: true
    workflow: "security.yml"
    job: "security-analysis"
    status: "not_implemented"
  documentation:
    review_required_for_relevant_changes: true
    workflow: "pr-validation.yml"
    job: "pr-validation"
    status: "not_implemented"
